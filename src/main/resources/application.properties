spring.application.name=${SPRING_APPLICATION_NAME:Logistics backend}
server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api/v1/}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
spring.config.activate.on-profile=default

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST:localhost}:${SPRING_DATASOURCE_PORT:5432}/${SPRING_DATASOURCE_DATABASE:logistics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

endpoints.frontend.url=${ENDPOINTS_FRONTEND_URL:http://localhost:3000}
